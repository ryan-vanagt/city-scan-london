services:
  ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingestion
    volumes:
      - app_data:/app/data
      - app_embeddings:/app/embeddings
    env_file: .env
    environment:
      CHROMADB_HOST: chromadb
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_data:/app/data
      - app_embeddings:/app/embeddings
    env_file: .env
    environment:
      CHROMADB_HOST: chromadb
    depends_on:
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 50
      start_period: 600s
    restart: unless-stopped

  mcp_server:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - app_data:/app/data
    env_file: .env
    environment:
      CHROMADB_HOST: chromadb
      MCP_HOST: "0.0.0.0"
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:0.6.3
    # No host port exposure — other services reach chromadb via Docker network name
    volumes:
      - app_embeddings:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  app_data:
  app_embeddings:
