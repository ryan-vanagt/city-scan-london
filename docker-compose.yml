services:
  ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingestion
    volumes:
      - app_data:/app/data
      - app_embeddings:/app/embeddings
    env_file: .env
    environment:
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: "8000"
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    # No host port publish — reachable only via the Caddy reverse proxy on the
    # compose network. See docker/Caddyfile for the /api/* route.
    volumes:
      - app_data:/app/data
      - app_embeddings:/app/embeddings
    env_file: .env
    environment:
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: "8000"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 50
      start_period: 600s
    restart: unless-stopped

  mcp_server:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - app_data:/app/data
    env_file: .env
    environment:
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: "8000"
      MCP_HOST: "0.0.0.0"
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        # Public URL under which the frontend bundle calls the API (baked at build time).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    # No host port publish — reachable only via the Caddy reverse proxy on the
    # compose network.
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api
    restart: unless-stopped

  chromadb:
    build:
      context: .
      dockerfile: docker/Dockerfile.chromadb
    # No host port exposure — other services reach chromadb via Docker network name
    volumes:
      - app_embeddings:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  app_data:
  app_embeddings:
  caddy_data:
  caddy_config:
