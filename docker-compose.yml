version: "3.9"

services:
  ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingestion
    volumes:
      - app_data:/app/data
      - app_embeddings:/app/embeddings
    env_file: .env
    depends_on:
      - chromadb
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
      - app_embeddings:/app/embeddings
    env_file: .env
    depends_on:
      - chromadb
    restart: unless-stopped

  mcp_server:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    ports:
      - "8002:8002"
    volumes:
      - app_data:/app/data
    env_file: .env
    depends_on:
      - chromadb
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - api
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - app_embeddings:/chroma/chroma
    restart: unless-stopped

volumes:
  app_data:
  app_embeddings:
